<!-- Mermaid.js — render mermaid code blocks as diagrams -->
<style>
.mermaid { margin: 1.5rem 0; text-align: center; }
.mermaid svg { max-width: 100%; height: auto; }
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
mermaid.initialize({ startOnLoad: false });
async function renderMermaid() {
  // Support both legacy <div class="mermaid"> AND Hugo's <code class="language-mermaid">
  var sources = document.querySelectorAll('.mermaid, code.language-mermaid');
  var nodes = [];
  for (var i = 0; i < sources.length; i++) {
    var el = sources[i];
    // Extract mermaid text: from <code> if nested, otherwise raw text
    var codeEl = el.querySelector ? el.querySelector('code') : null;
    var diagram = codeEl ? codeEl.textContent : el.textContent;
    var wrapper = document.createElement('div');
    wrapper.className = 'mermaid';
    wrapper.textContent = diagram.trim();

    // Replace the right parent: <code class="language-mermaid"> lives inside <pre>,
    // so replace the whole <pre> to avoid leftover <pre> styling around the diagram.
    var target = el.tagName.toLowerCase() === 'code' ? el.parentNode : el;
    target.parentNode.replaceChild(wrapper, target);
    nodes.push(wrapper);
  }
  // Render ALL diagrams in one mermaid.run() call so each gets a unique cache ID.
  // Calling mermaid.run() per-diagram in Promise.all causes Date.now() collisions.
  if (nodes.length > 0) {
    await mermaid.run({ nodes });
  }
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderMermaid);
} else {
  renderMermaid();
}
</script>

<!-- Umami Analytics — with client cookie differentiation -->
<script async defer src="https://umami.eywalink.org/script.js" data-website-id="a0b6f621-98c9-4adb-82f9-4f179a08d674" data-before-send="umamiBeforeSend"></script>
<script>
// Cookie helpers
function _setCookie(name, val, days) {
  var d = new Date();
  d.setTime(d.getTime() + (days * 864e5));
  document.cookie = name + '=' + val + ';expires=' + d.toUTCString() + ';path=/';
}
function _getCookie(name) {
  var m = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
  return m ? m[1] : null;
}
function _sha256(text) {
  var buf = new TextEncoder().encode(text);
  return crypto.subtle.digest('SHA-256', buf).then(function(hash) {
    return Array.from(new Uint8Array(hash)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
  });
}

// Stable reader ID — persists across sessions via 1st-party cookie
var _readerIdCookie = 'ew_reader_id';
(async function() {
  var existing = _getCookie(_readerIdCookie);
  if (!existing) {
    var raw = crypto.randomUUID();
    var hashed = await _sha256(raw);
    var id = hashed.substring(0, 40);
    _setCookie(_readerIdCookie, id, 730); // 2 years
  }
  // Wait for umami global, then identify
  var tries = 0;
  function tryIdentify() {
    if (window.umami && umami.identify) {
      var rid = _getCookie(_readerIdCookie);
      if (rid) umami.identify(rid, { source: 'reader_cookie' });
    } else if (++tries < 20) {
      setTimeout(tryIdentify, 100);
    }
  }
  tryIdentify();
})();

// Attach cookie-derived metadata to every event
function umamiBeforeSend(type, payload) {
  var rid = _getCookie(_readerIdCookie);
  if (rid) {
    payload.reader_id = rid;
  }
  return payload;
}
</script>
<!-- Card grid styles for index page -->
<style>
/* Token layer — card grid */
:root {
  --color-surface: #ffffff;
  --color-text: #1a1a2e;
  --color-text-secondary: #5a5a7a;
  --color-accent: #2563eb;
  --color-accent-light: #eff6ff;
  --color-border: #e2e4ea;
  --color-date: #8b8fa3;
  --radius-md: 10px;
  --shadow-card: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-card-hover: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
}

.section-label {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--color-date);
  margin: 0 0 var(--space-lg) 0;
}

.section-divider {
  border: none;
  border-bottom: 1px solid var(--color-border);
  margin: var(--space-lg) 0;
}

/* Card grid */
.post-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-lg);
  margin-bottom: var(--space-lg);
}

.post-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-lg);
  box-shadow: var(--shadow-card);
  transition: box-shadow 0.2s ease, transform 0.15s ease;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
}

.post-card:hover {
  box-shadow: var(--shadow-card-hover);
  transform: translateY(-2px);
}

.post-card:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

/* Featured card (first post) — spans full width */
.post-card--featured {
  grid-column: 1 / -1;
  flex-direction: row;
  align-items: center;
  gap: var(--space-lg);
}

.post-card--featured .post-card__title {
  font-size: 1.25rem;
}

.post-card--featured .post-card__meta {
  min-width: 140px;
  flex-shrink: 0;
  text-align: right;
}

.post-card__date {
  font-size: 0.8rem;
  color: var(--color-date);
  font-weight: 500;
  margin: 0;
}

.post-card__title {
  font-size: 1.05rem;
  font-weight: 600;
  line-height: 1.35;
  color: var(--color-text);
  margin: 0;
}

.post-card__excerpt {
  font-size: 0.88rem;
  color: var(--color-text-secondary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin: 0;
}

.post-card--featured .post-card__excerpt {
  -webkit-line-clamp: 2;
}

.post-card__cta {
  color: var(--color-accent);
  font-size: 0.85rem;
  font-weight: 500;
}

.post-card__tags {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-xs);
  margin-top: auto;
  padding-top: var(--space-sm);
}

.tag {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--color-accent-light);
  color: var(--color-accent);
}

/* Mobile */
@media (max-width: 640px) {
  .post-grid {
    grid-template-columns: 1fr;
  }
  .post-card--featured {
    grid-column: auto;
    flex-direction: column;
    align-items: stretch;
  }
  .post-card--featured .post-card__meta {
    min-width: auto;
    text-align: left;
    padding-top: var(--space-sm);
  }
}

/* Suppress Architect theme h2::before "//" on card titles and section headers */
.post-card h2::before,
.post-card__title::before,
.about-heading::before,
.section-label::before {
  content: none !important;
}

/* Tighten about section */
.about-heading {
  margin-bottom: var(--space-md);
}
.about-topics {
  font-size: 0.9rem;
  color: var(--color-text-secondary);
}
.footer-links {
  font-size: 0.9rem;
}
</style>
