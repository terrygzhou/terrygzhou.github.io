<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arc-title arc-desc"><style type="text/css">svg text{font-family: system-ui, "Helvetica Neue", Arial, sans-serif;}svg .ev-sub, svg .ev-soft, svg .ev-legend, svg .ev-callout, svg .arch-sub, svg .arch-note, svg .arch-loop, svg .arch-legend, svg .pl-sub, svg .pl-note, svg .pl-loop, svg .pl-legend{font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;}svg .ev-eyebrow, svg .ev-eyebrow-ac, svg .arch-eyebrow, svg .arch-eyebrow-ac, svg .pl-eyebrow, svg .pl-eyebrow-ac{font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;}svg .ev-callout, svg .arch-note, svg .pl-note{font-family: Georgia, "Times New Roman", serif; font-style: italic;}svg .arch-legend, svg .ev-legend, svg .pl-legend{font-size:8px; letter-spacing:0.06em;}</style>
        <title id="arc-title">Architecture of the local digital twin</title>
        <desc id="arc-desc">Sourcing channels feed a processing pipeline (dedupe, embed, GraphRAG extract) into two stores (Qdrant, Neo4j). The consumption brain (Mem0 adaptive layer plus a local GPU LLM) answers any agent session, and a heartbeat of scheduled jobs feeds everything back into sourcing overnight.</desc>
        <defs>
          <marker id="a-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"></polygon></marker>
          <marker id="a-arrow-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"></polygon></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"></rect>

        <!-- ===== tier bands ===== -->
        <rect x="8" y="24" width="780" height="126" rx="6" fill="rgba(79,93,117,0.05)"></rect>
        <rect x="8" y="162" width="780" height="78" rx="6" fill="#ffffff"></rect>
        <rect x="8" y="252" width="780" height="80" rx="6" fill="rgba(45,49,66,0.05)"></rect>
        <rect x="8" y="344" width="780" height="80" rx="6" fill="rgba(191,69,32,0.06)"></rect>
        <rect x="8" y="436" width="780" height="58" rx="6" fill="rgba(79,93,117,0.08)"></rect>
        <rect x="8" y="506" width="780" height="78" rx="6" fill="rgba(191,69,32,0.05)"></rect>
        <!-- tier tab labels -->
        <text class="ar-tier" x="24" y="44">SOURCING</text>
        <text class="ar-tier" x="24" y="180">PROCESSING</text>
        <text class="ar-tier" x="24" y="270">STORAGE</text>
        <text class="ar-tier ar-tier-ac" x="24" y="362">CONSUMPTION · local LLM (GPU) + Mem0 adaptive layer</text>
        <text class="ar-tier" x="24" y="454">AGENTS · any session starts fresh</text>
        <text class="ar-tier ar-tier-ac" x="24" y="524">HEARTBEAT · scheduled jobs (cron)</text>

        <!-- ===== vertical spine arrows (center x=400) ===== -->
        <line x1="400" y1="150" x2="400" y2="162" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a-arrow)"></line>
        <line x1="400" y1="332" x2="400" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a-arrow)"></line>
        <line x1="400" y1="424" x2="400" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a-arrow)"></line>
        <line x1="400" y1="494" x2="400" y2="506" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a-arrow)"></line>

        <!-- processing chain internal arrows (left -> right) -->
        <line x1="262" y1="210" x2="284" y2="210" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a-arrow)"></line>
        <line x1="514" y1="210" x2="536" y2="210" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a-arrow)"></line>
        <!-- embedding -> Qdrant ; extraction -> Neo4j -->
        <line x1="380" y1="240" x2="180" y2="296" stroke="#4f5d75" stroke-width="1" marker-end="url(#a-arrow)"></line>
        <line x1="620" y1="240" x2="620" y2="296" stroke="#4f5d75" stroke-width="1" marker-end="url(#a-arrow)"></line>
        <text class="ar-edge" x="250" y="272">semantic chunks</text>
        <text class="ar-edge" x="632" y="272">entities + relationships</text>
        <!-- storage -> consumption brain (fan to Mem0) -->
        <line x1="180" y1="332" x2="300" y2="370" stroke="#4f5d75" stroke-width="1" marker-end="url(#a-arrow)"></line>
        <line x1="620" y1="332" x2="360" y2="370" stroke="#4f5d75" stroke-width="1" marker-end="url(#a-arrow)"></line>
        <text class="ar-edge" x="150" y="356">vector search</text>
        <text class="ar-edge" x="470" y="356">graph traversal</text>
        <!-- consumption internal: Mem0 -> LLM -->
        <line x1="410" y1="392" x2="434" y2="392" stroke="#bf4520" stroke-width="1.2" marker-end="url(#a-arrow-ac)"></line>
        <!-- LLM -> agents -->
        <line x1="620" y1="424" x2="620" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a-arrow)"></line>
        <text class="ar-edge" x="632" y="432">one synthesised answer</text>

        <!-- heartbeat: agents -> heartbeat (outputs) -->
        <line x1="400" y1="506" x2="400" y2="506" stroke="#bf4520" stroke-width="0"></line>
        <text class="ar-loop" x="700" y="500" text-anchor="end">outputs · corrections · decisions</text>

        <!-- SOURCING boxes (3 + 2) -->
        <rect x="24" y="58" width="240" height="42" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"></rect>
        <text class="ar-name" x="144" y="78" text-anchor="middle">Telegram / social</text>
        <rect x="284" y="58" width="240" height="42" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"></rect>
        <text class="ar-name" x="404" y="78" text-anchor="middle">VS Code sessions</text>
        <rect x="544" y="58" width="240" height="42" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"></rect>
        <text class="ar-name" x="664" y="78" text-anchor="middle">research papers / GitHub</text>
        <rect x="24" y="104" width="380" height="42" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"></rect>
        <text class="ar-name" x="214" y="124" text-anchor="middle">Obsidian / Apple Notes / emails / PDFs</text>
        <rect x="424" y="104" width="360" height="42" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"></rect>
        <text class="ar-name" x="604" y="124" text-anchor="middle">web content / research crons</text>

        <!-- PROCESSING chain (3 steps) -->
        <rect x="110" y="188" width="152" height="44" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"></rect>
        <text class="ar-name" x="186" y="210" text-anchor="middle">dedupe + chunk</text>
        <rect x="284" y="188" width="230" height="44" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"></rect>
        <text class="ar-name" x="399" y="204" text-anchor="middle">embeddings (CPU)</text>
        <text class="ar-sub" x="399" y="220" text-anchor="middle">preserves GPU for the brain</text>
        <rect x="536" y="188" width="250" height="44" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"></rect>
        <text class="ar-name" x="661" y="204" text-anchor="middle">custom GraphRAG extraction</text>
        <text class="ar-sub" x="661" y="220" text-anchor="middle">LLM · batched</text>

        <!-- STORAGE (2 cylinders) -->
        <rect x="40" y="296" width="280" height="48" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"></rect>
        <line x1="40" y1="310" x2="320" y2="310" stroke="rgba(79,93,117,0.35)" stroke-width="1"></line>
        <text class="ar-name" x="180" y="312" text-anchor="middle">Qdrant</text>
        <text class="ar-sub" x="180" y="328" text-anchor="middle">344K chunks · hybrid search</text>
        <rect x="480" y="296" width="280" height="48" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"></rect>
        <line x1="480" y1="310" x2="760" y2="310" stroke="rgba(79,93,117,0.35)" stroke-width="1"></line>
        <text class="ar-name" x="620" y="312" text-anchor="middle">Neo4j</text>
        <text class="ar-sub" x="620" y="328" text-anchor="middle">18.5K entities · ~75K rels</text>

        <!-- CONSUMPTION brain (focal): Mem0 -> LLM -->
        <rect x="210" y="370" width="200" height="44" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"></rect>
        <text class="ar-name" x="310" y="396" text-anchor="middle">Mem0 adaptive layer</text>
        <rect x="434" y="370" width="200" height="44" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"></rect>
        <text class="ar-name" x="534" y="396" text-anchor="middle">local LLM (GPU)</text>

        <!-- AGENTS -->
        <rect x="150" y="460" width="180" height="34" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"></rect>
        <text class="ar-name" x="240" y="481" text-anchor="middle">Telegram</text>
        <rect x="330" y="460" width="180" height="34" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"></rect>
        <text class="ar-name" x="420" y="481" text-anchor="middle">VS Code</text>
        <rect x="510" y="460" width="180" height="34" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"></rect>
        <text class="ar-name" x="600" y="481" text-anchor="middle">web console</text>

        <!-- HEARTBEAT jobs (autonomous scheduled jobs) -->
        <rect x="120" y="532" width="200" height="44" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"></rect>
        <text class="ar-name" x="220" y="556" text-anchor="middle">daily session ingest</text>
        <rect x="340" y="532" width="200" height="44" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"></rect>
        <text class="ar-name" x="440" y="556" text-anchor="middle">memory consolidation</text>
        <rect x="560" y="532" width="200" height="44" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"></rect>
        <text class="ar-name" x="660" y="556" text-anchor="middle">prune + backfill</text>

        <!-- heartbeat -> SOURCING overnight (dashed accent, up the left margin) -->
        <path d="M 120 554 L 40 554 L 40 79 L 24 79" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a-arrow-ac)"></path>
        <text class="ar-loop" x="52" y="300" text-anchor="middle" transform="rotate(-90 52 300)">fed into SOURCING overnight</text>

        <!-- maintenance -> STORAGE (dashed, quiet self-maintenance) -->
        <path d="M 660 532 L 660 344" fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a-arrow)"></path>
        <text class="ar-edge" x="672" y="470">consolidate · prune</text>

        <!-- legend strip -->
        <line x1="8" y1="600" x2="788" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"></line>
        <rect x="24" y="612" width="12" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"></rect>
        <text class="ar-legend" x="44" y="622">SOURCE</text>
        <rect x="120" y="612" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"></rect>
        <text class="ar-legend" x="140" y="622">WORK</text>
        <rect x="208" y="612" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"></rect>
        <text class="ar-legend" x="228" y="622">STORE</text>
        <rect x="304" y="612" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"></rect>
        <text class="ar-legend" x="324" y="622">BRAIN / JOB</text>
        <line x1="440" y1="618" x2="464" y2="618" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a-arrow-ac)"></line>
        <text class="ar-legend" x="474" y="622">OVERNIGHT LOOP</text>
      </svg>