<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four-Phase Evolution of the Digital Twin</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink:   #2d3142;
      --color-muted: #4f5d75;
      --color-soft:  #5a6580;
      --color-accent:#bf4520;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 760px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 720px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }

    /* Diagram text roles (carried into the exported SVG) */
    svg text { font-family: 'Geist', system-ui, sans-serif; }
    .ev-eyebrow    { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 7px; font-weight: 500; letter-spacing: 0.18em; fill: #5a6580; }
    .ev-eyebrow-ac { fill: #bf4520; }
    .ev-name       { font-size: 13px; font-weight: 600; fill: #2d3142; }
    .ev-sub        { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; }
    .ev-soft       { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #5a6580; }
    .ev-callout    { font-family: 'Instrument Serif', 'Noto Serif', serif; font-style: italic; font-size: 13px; fill: #5a6580; }
    .ev-legend     { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.06em; fill: #5a6580; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process &middot; Diagram Design</p>
    <h1>Four-Phase Evolution of the Digital Twin</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 720 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="evo-title evo-desc">
        <title id="evo-title">Four-Phase Evolution of the Digital Twin</title>
        <desc id="evo-desc">A top-down process of four phases: static snapshot, single-source memory in Qdrant, adaptive learning with Mem0, and graph understanding with Neo4j, each solving the previous phase's bottleneck.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- arrows first (downward, shared x=360, straight verticals) -->
        <line x1="360" y1="168" x2="360" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="328" x2="360" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="488" x2="360" y2="548" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- transition callouts to the right of each arrow (clear of the x=360 spine) -->
        <text class="ev-callout" x="384" y="200">one source of truth</text>
        <text class="ev-callout" x="384" y="360">context-aware recall</text>
        <text class="ev-callout" x="384" y="520">a connected story</text>

        <!-- PHASE 1 : input treatment -->
        <rect x="140" y="72" width="440" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text class="ev-eyebrow" x="360" y="98" text-anchor="middle">PHASE 1 &middot; STATIC SNAPSHOT</text>
        <text class="ev-name" x="360" y="124" text-anchor="middle">Tools demanded structure first</text>
        <text class="ev-sub" x="360" y="144" text-anchor="middle">AnythingLLM &middot; OpenNotebook &middot; llm_wiki</text>
        <text class="ev-soft" x="360" y="158" text-anchor="middle">two systems, two graphs, no merge path</text>

        <!-- PHASE 2 : store treatment -->
        <rect x="140" y="232" width="440" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text class="ev-eyebrow" x="360" y="258" text-anchor="middle">PHASE 2 &middot; MEMORY</text>
        <text class="ev-name" x="360" y="284" text-anchor="middle">One source of truth</text>
        <text class="ev-sub" x="360" y="304" text-anchor="middle">Qdrant &middot; one collection &middot; hybrid search</text>
        <text class="ev-soft" x="360" y="318" text-anchor="middle">retrieval floods the context window</text>

        <!-- PHASE 3 : backend treatment -->
        <rect x="140" y="392" width="440" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="ev-eyebrow" x="360" y="418" text-anchor="middle">PHASE 3 &middot; LEARNING</text>
        <text class="ev-name" x="360" y="444" text-anchor="middle">Adaptive, selective memory</text>
        <text class="ev-sub" x="360" y="464" text-anchor="middle">Mem0 &middot; context-aware retrieval layer</text>
        <text class="ev-soft" x="360" y="478" text-anchor="middle">remembers what matters, not everything</text>

        <!-- PHASE 4 : focal treatment -->
        <rect x="140" y="552" width="440" height="96" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text class="ev-eyebrow ev-eyebrow-ac" x="360" y="578" text-anchor="middle">PHASE 4 &middot; UNDERSTANDING</text>
        <text class="ev-name" x="360" y="604" text-anchor="middle">Graph understanding</text>
        <text class="ev-sub" x="360" y="624" text-anchor="middle">GraphRAG &rarr; Neo4j &middot; 18.5K entities &middot; 75K rels</text>

        <!-- legend strip -->
        <line x1="30" y1="676" x2="690" y2="676" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="30" y="690" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text class="ev-legend" x="50" y="700">THE WORKING TWIN</text>
        <line x1="190" y1="696" x2="214" y2="696" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text class="ev-legend" x="224" y="700">BOTTLENECK SOLVED</text>
      </svg>
    </div>
  </div>
</body>
</html>
