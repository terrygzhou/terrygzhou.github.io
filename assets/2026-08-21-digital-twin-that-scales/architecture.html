<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture — The Digital Twin Stack</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink:   #2d3142;
      --color-muted: #4f5d75;
      --color-soft:  #5a6580;
      --color-accent:#bf4520;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 860px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 840px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }

    /* Diagram text roles (carried into the exported SVG) */
    svg text { font-family: 'Geist', system-ui, sans-serif; }
    .ar-tier     { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.14em; fill: #5a6580; }
    .ar-tier-ac  { fill: #bf4520; }
    .ar-name     { font-size: 12px; font-weight: 600; fill: #2d3142; }
    .ar-sub      { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8.5px; fill: #4f5d75; }
    .ar-edge     { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.04em; fill: #5a6580; }
    .ar-loop     { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.06em; fill: #bf4520; }
    .ar-legend   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.06em; fill: #5a6580; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture &middot; Diagram Design</p>
    <h1>The Digital Twin Stack &mdash; everything on one home server</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 840 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arc-title arc-desc">
        <title id="arc-title">Architecture of the local digital twin</title>
        <desc id="arc-desc">Sourcing channels feed a processing pipeline (dedupe, embed, GraphRAG extract) into two stores (Qdrant, Neo4j). The consumption brain (Mem0 adaptive layer plus a local GPU LLM) answers any agent session, and a heartbeat of scheduled jobs feeds everything back into sourcing overnight.</desc>
        <defs>
          <marker id="a-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="a-arrow-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== tier bands ===== -->
        <rect x="8" y="24"  width="780" height="126" rx="6" fill="rgba(79,93,117,0.05)"/>
        <rect x="8" y="162" width="780" height="78"  rx="6" fill="#ffffff"/>
        <rect x="8" y="252" width="780" height="80"  rx="6" fill="rgba(45,49,66,0.05)"/>
        <rect x="8" y="344" width="780" height="80"  rx="6" fill="rgba(191,69,32,0.06)"/>
        <rect x="8" y="436" width="780" height="58"  rx="6" fill="rgba(79,93,117,0.08)"/>
        <rect x="8" y="506" width="780" height="78"  rx="6" fill="rgba(79,93,117,0.06)"/>
        <!-- tier tab labels -->
        <text class="ar-tier" x="24" y="44">SOURCING</text>
        <text class="ar-tier" x="24" y="180">PROCESSING</text>
        <text class="ar-tier" x="24" y="270">STORAGE</text>
        <text class="ar-tier ar-tier-ac" x="24" y="362">CONSUMPTION</text>
        <text class="ar-tier" x="24" y="454">AGENTS &middot; fresh sessions</text>
        <text class="ar-tier ar-tier-ac" x="24" y="524">HEARTBEAT &middot; cron jobs</text>

        <!-- ===== CONNECTORS (drawn before boxes) ===== -->
        <!-- SOURCING -> PROCESSING aggregate spine -->
        <line x1="400" y1="150" x2="400" y2="162" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a-arrow)"/>
        <!-- PROCESSING internal: dedup -> embed -> extract -->
        <line x1="262" y1="210" x2="284" y2="210" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a-arrow)"/>
        <line x1="514" y1="210" x2="536" y2="210" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a-arrow)"/>
        <!-- embed -> Qdrant (elbow) -->
        <path d="M 300 232 L 300 264 L 180 264 L 180 296" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#a-arrow)"/>
        <rect x="196" y="252" width="98" height="14" fill="#f5f5f5"/>
        <text class="ar-edge" x="245" y="262" text-anchor="middle">SEMANTIC CHUNKS</text>
        <!-- extract -> Neo4j (vertical) -->
        <line x1="620" y1="232" x2="620" y2="296" stroke="#4f5d75" stroke-width="1" marker-end="url(#a-arrow)"/>
        <rect x="632" y="258" width="150" height="14" fill="#f5f5f5"/>
        <text class="ar-edge" x="707" y="268" text-anchor="middle">ENTITIES + RELATIONSHIPS</text>
        <!-- Qdrant -> Mem0 (elbow) -->
        <path d="M 180 344 L 180 357 L 310 357 L 310 370" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#a-arrow)"/>
        <rect x="150" y="346" width="72" height="14" fill="#f5f5f5"/>
        <text class="ar-edge" x="186" y="356" text-anchor="middle">VECTOR SEARCH</text>
        <!-- Neo4j -> LLM (elbow) -->
        <path d="M 620 344 L 620 357 L 534 357 L 534 370" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#a-arrow)"/>
        <rect x="556" y="346" width="96" height="14" fill="#f5f5f5"/>
        <text class="ar-edge" x="604" y="356" text-anchor="middle">GRAPH TRAVERSAL</text>
        <!-- Mem0 -> LLM (internal, neutral) -->
        <line x1="410" y1="392" x2="434" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a-arrow)"/>
        <!-- LLM -> AGENTS (answer spine) -->
        <line x1="534" y1="414" x2="534" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a-arrow)"/>
        <rect x="546" y="418" width="150" height="14" fill="#f5f5f5"/>
        <text class="ar-edge" x="621" y="428" text-anchor="middle">ONE SYNTHESISED ANSWER</text>
        <!-- AGENTS -> HEARTBEAT (feedback) -->
        <line x1="400" y1="494" x2="400" y2="506" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a-arrow)"/>
        <rect x="412" y="494" width="182" height="14" fill="#f5f5f5"/>
        <text class="ar-edge" x="503" y="504" text-anchor="middle">OUTPUTS &middot; CORRECTIONS &middot; DECISIONS</text>
        <!-- HEARTBEAT -> SOURCING overnight loop (dashed accent, up the left margin) -->
        <path d="M 120 554 L 16 554 L 16 79 L 24 79" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a-arrow-ac)"/>
        <g transform="rotate(-90 8 300)">
          <rect x="-51" y="-7" width="118" height="14" fill="#f5f5f5"/>
          <text class="ar-loop" x="8" y="4" text-anchor="middle">FED INTO SOURCING OVERNIGHT</text>
        </g>

        <!-- ===== SOURCING boxes (3 + 2) ===== -->
        <rect x="24"  y="58"  width="240" height="42" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text class="ar-name" x="144" y="78" text-anchor="middle">Telegram / social</text>
        <rect x="284" y="58" width="240" height="42" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text class="ar-name" x="404" y="78" text-anchor="middle">VS Code sessions</text>
        <rect x="544" y="58" width="240" height="42" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text class="ar-name" x="664" y="78" text-anchor="middle">research papers / GitHub</text>
        <rect x="24"  y="104" width="380" height="42" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text class="ar-name" x="214" y="124" text-anchor="middle">Obsidian / Apple Notes / emails / PDFs</text>
        <rect x="424" y="104" width="360" height="42" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text class="ar-name" x="604" y="124" text-anchor="middle">web content / research crons</text>

        <!-- ===== PROCESSING chain (3 steps) ===== -->
        <rect x="110" y="188" width="152" height="44" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="ar-name" x="186" y="214" text-anchor="middle">dedupe + chunk</text>
        <rect x="284" y="188" width="230" height="44" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="ar-name" x="399" y="204" text-anchor="middle">embeddings (CPU)</text>
        <text class="ar-sub" x="399" y="220" text-anchor="middle">preserves GPU for the brain</text>
        <rect x="536" y="188" width="250" height="44" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="ar-name" x="661" y="204" text-anchor="middle">custom GraphRAG extraction</text>
        <text class="ar-sub" x="661" y="220" text-anchor="middle">LLM &middot; batched</text>

        <!-- ===== STORAGE (2 cylinders) ===== -->
        <rect x="40" y="296" width="280" height="48" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <line x1="40" y1="310" x2="320" y2="310" stroke="rgba(79,93,117,0.35)" stroke-width="1"/>
        <text class="ar-name" x="180" y="312" text-anchor="middle">Qdrant</text>
        <text class="ar-sub" x="180" y="328" text-anchor="middle">344K chunks &middot; hybrid search</text>
        <rect x="480" y="296" width="280" height="48" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <line x1="480" y1="310" x2="760" y2="310" stroke="rgba(79,93,117,0.35)" stroke-width="1"/>
        <text class="ar-name" x="620" y="312" text-anchor="middle">Neo4j</text>
        <text class="ar-sub" x="620" y="328" text-anchor="middle">18.5K entities &middot; ~75K rels</text>

        <!-- ===== CONSUMPTION brain (focal): Mem0 -> LLM ===== -->
        <rect x="210" y="370" width="200" height="44" rx="4" fill="rgba(191,69,32,0.10)" stroke="#bf4520" stroke-width="1.2"/>
        <text class="ar-name" x="310" y="396" text-anchor="middle">Mem0 adaptive layer</text>
        <rect x="434" y="370" width="200" height="44" rx="4" fill="rgba(191,69,32,0.10)" stroke="#bf4520" stroke-width="1.2"/>
        <text class="ar-name" x="534" y="396" text-anchor="middle">local LLM (GPU)</text>

        <!-- ===== AGENTS ===== -->
        <rect x="150" y="460" width="180" height="34" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text class="ar-name" x="240" y="481" text-anchor="middle">Telegram</text>
        <rect x="330" y="460" width="180" height="34" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text class="ar-name" x="420" y="481" text-anchor="middle">VS Code</text>
        <rect x="510" y="460" width="180" height="34" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text class="ar-name" x="600" y="481" text-anchor="middle">web console</text>

        <!-- ===== HEARTBEAT jobs ===== -->
        <rect x="120" y="532" width="200" height="44" rx="4" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/>
        <text class="ar-name" x="220" y="550" text-anchor="middle">daily session ingest</text>
        <text class="ar-sub" x="220" y="564" text-anchor="middle">cron</text>
        <rect x="340" y="532" width="200" height="44" rx="4" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/>
        <text class="ar-name" x="440" y="550" text-anchor="middle">memory consolidation</text>
        <text class="ar-sub" x="440" y="564" text-anchor="middle">cron</text>
        <rect x="560" y="532" width="200" height="44" rx="4" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/>
        <text class="ar-name" x="660" y="550" text-anchor="middle">prune + backfill</text>
        <text class="ar-sub" x="660" y="564" text-anchor="middle">cron</text>

        <!-- ===== legend strip ===== -->
        <line x1="8" y1="600" x2="788" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="24"  y="612" width="12" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text class="ar-legend" x="44"  y="622">SOURCE / AGENT / JOB</text>
        <rect x="180" y="612" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="ar-legend" x="200" y="622">WORK</text>
        <rect x="260" y="612" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text class="ar-legend" x="280" y="622">STORE</text>
        <rect x="340" y="612" width="12" height="12" rx="2" fill="rgba(191,69,32,0.10)" stroke="#bf4520" stroke-width="1"/>
        <text class="ar-legend" x="360" y="622">BRAIN</text>
        <line x1="440" y1="618" x2="464" y2="618" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a-arrow-ac)"/>
        <text class="ar-legend" x="474" y="622">OVERNIGHT LOOP</text>
      </svg>
    </div>
  </div>
</body>
</html>
