<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="evo-title evo-desc"><style type="text/css">svg text{font-family: system-ui, "Helvetica Neue", Arial, sans-serif;}svg .ev-sub, svg .ev-soft, svg .ev-legend, svg .ev-callout, svg .arch-sub, svg .arch-note, svg .arch-loop, svg .arch-legend, svg .pl-sub, svg .pl-note, svg .pl-loop, svg .pl-legend{font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;}svg .ev-eyebrow, svg .ev-eyebrow-ac, svg .arch-eyebrow, svg .arch-eyebrow-ac, svg .pl-eyebrow, svg .pl-eyebrow-ac{font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;}svg .ev-callout, svg .arch-note, svg .pl-note{font-family: Georgia, "Times New Roman", serif; font-style: italic;}svg .arch-legend, svg .ev-legend, svg .pl-legend{font-size:8px; letter-spacing:0.06em;}</style>
        <title id="evo-title">Four-Phase Evolution of the Digital Twin</title>
        <desc id="evo-desc">A top-down process of four phases: static snapshot, single-source memory in Qdrant, adaptive learning with Mem0, and graph understanding with Neo4j, each solving the previous phase's bottleneck.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"></polygon></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"></polygon></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"></rect>

        <!-- arrows first (downward, shared x=360) -->
        <line x1="360" y1="168" x2="360" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"></line>
        <line x1="360" y1="328" x2="360" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"></line>
        <line x1="360" y1="488" x2="360" y2="548" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"></line>

        <!-- transition callouts to the right of each arrow -->
        <text class="ev-callout" x="560" y="200">one source of truth</text>
        <text class="ev-callout" x="560" y="360">context-aware recall</text>
        <text class="ev-callout" x="560" y="520">a connected story</text>

        <!-- PHASE 1 : input treatment -->
        <rect x="140" y="72" width="440" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"></rect>
        <text class="ev-eyebrow" x="360" y="98" text-anchor="middle">PHASE 1 · STATIC SNAPSHOT</text>
        <text class="ev-name" x="360" y="124" text-anchor="middle">Tools demanded structure first</text>
        <text class="ev-sub" x="360" y="144" text-anchor="middle">AnythingLLM · OpenNotebook · llm_wiki</text>
        <text class="ev-soft" x="360" y="158" text-anchor="middle">two systems, two graphs, no merge path</text>

        <!-- PHASE 2 : store treatment -->
        <rect x="140" y="232" width="440" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"></rect>
        <text class="ev-eyebrow" x="360" y="258" text-anchor="middle">PHASE 2 · MEMORY</text>
        <text class="ev-name" x="360" y="284" text-anchor="middle">One source of truth</text>
        <text class="ev-sub" x="360" y="304" text-anchor="middle">Qdrant · one collection · hybrid search</text>
        <text class="ev-soft" x="360" y="318" text-anchor="middle">retrieval floods the context window</text>

        <!-- PHASE 3 : backend treatment -->
        <rect x="140" y="392" width="440" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"></rect>
        <text class="ev-eyebrow" x="360" y="418" text-anchor="middle">PHASE 3 · LEARNING</text>
        <text class="ev-name" x="360" y="444" text-anchor="middle">Adaptive, selective memory</text>
        <text class="ev-sub" x="360" y="464" text-anchor="middle">Mem0 · context-aware retrieval layer</text>
        <text class="ev-soft" x="360" y="478" text-anchor="middle">remembers what matters, not everything</text>

        <!-- PHASE 4 : focal treatment -->
        <rect x="140" y="552" width="440" height="96" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"></rect>
        <text class="ev-eyebrow ev-eyebrow-ac" x="360" y="578" text-anchor="middle">PHASE 4 · UNDERSTANDING</text>
        <text class="ev-name" x="360" y="604" text-anchor="middle">Graph understanding</text>
        <text class="ev-sub" x="360" y="624" text-anchor="middle">GraphRAG → Neo4j · 18.5K entities · 75K rels</text>

        <!-- legend strip -->
        <line x1="30" y1="676" x2="690" y2="676" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"></line>
        <rect x="30" y="690" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"></rect>
        <text class="ev-legend" x="50" y="700">THE WORKING TWIN</text>
        <line x1="190" y1="696" x2="214" y2="696" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"></line>
        <text class="ev-legend" x="224" y="700">BOTTLENECK SOLVED</text>
      </svg>