<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="evo-title evo-desc" id="evolution-root">
        <title id="evo-title">Four-Phase Evolution of the Digital Twin</title>
        <desc id="evo-desc">A top-down process of four phases: static snapshot, single-source memory in Qdrant, adaptive learning with Mem0, and graph understanding with Neo4j, each solving the previous phase's bottleneck.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #evolution-root { --color-paper: #f5f5f5;
      --color-ink:   #2d3142;
      --color-muted: #4f5d75;
      --color-soft:  #5a6580;
      --color-accent:#bf4520;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace; }
      #evolution-root { font-family: var(--font-sans); color: var(--color-ink); }
      #evolution-root .diagram-container { width: 100%; overflow-x: auto; }
      #evolution-root .diagram-container { overflow-x: visible; }
      #evolution-root text { font-family: 'Geist', system-ui, sans-serif; }
      #evolution-root .ev-eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 7px; font-weight: 500; letter-spacing: 0.18em; fill: #5a6580; }
      #evolution-root .ev-eyebrow-ac { fill: #bf4520; }
      #evolution-root .ev-name { font-size: 13px; font-weight: 600; fill: #2d3142; }
      #evolution-root .ev-sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; }
      #evolution-root .ev-soft { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #5a6580; }
      #evolution-root .ev-callout { font-family: 'Instrument Serif', 'Noto Serif', serif; font-style: italic; font-size: 13px; fill: #5a6580; }
      #evolution-root .ev-legend { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.06em; fill: #5a6580; }</style>
          <marker id="evolution-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="evolution-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- arrows first (downward, shared x=360, straight verticals) -->
        <line x1="360" y1="168" x2="360" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#evolution-arrow)"/>
        <line x1="360" y1="328" x2="360" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#evolution-arrow)"/>
        <line x1="360" y1="488" x2="360" y2="548" stroke="#bf4520" stroke-width="1.2" marker-end="url(#evolution-arrow-accent)"/>

        <!-- transition callouts to the right of each arrow (clear of the x=360 spine) -->
        <text class="ev-callout" x="384" y="200">one source of truth</text>
        <text class="ev-callout" x="384" y="360">context-aware recall</text>
        <text class="ev-callout" x="384" y="520">a connected story</text>

        <!-- PHASE 1 : input treatment -->
        <rect x="140" y="72" width="440" height="96" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/>
        <text class="ev-eyebrow" x="360" y="98" text-anchor="middle">PHASE 1 · STATIC SNAPSHOT</text>
        <text class="ev-name" x="360" y="124" text-anchor="middle">Tools demanded structure first</text>
        <text class="ev-sub" x="360" y="144" text-anchor="middle">AnythingLLM · OpenNotebook · llm_wiki</text>
        <text class="ev-soft" x="360" y="158" text-anchor="middle">two systems, two graphs, no merge path</text>

        <!-- PHASE 2 : store treatment -->
        <rect x="140" y="232" width="440" height="96" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text class="ev-eyebrow" x="360" y="258" text-anchor="middle">PHASE 2 · MEMORY</text>
        <text class="ev-name" x="360" y="284" text-anchor="middle">One source of truth</text>
        <text class="ev-sub" x="360" y="304" text-anchor="middle">Qdrant · one collection · hybrid search</text>
        <text class="ev-soft" x="360" y="318" text-anchor="middle">retrieval floods the context window</text>

        <!-- PHASE 3 : backend treatment -->
        <rect x="140" y="392" width="440" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="ev-eyebrow" x="360" y="418" text-anchor="middle">PHASE 3 · LEARNING</text>
        <text class="ev-name" x="360" y="444" text-anchor="middle">Adaptive, selective memory</text>
        <text class="ev-sub" x="360" y="464" text-anchor="middle">Mem0 · context-aware retrieval layer</text>
        <text class="ev-soft" x="360" y="478" text-anchor="middle">remembers what matters, not everything</text>

        <!-- PHASE 4 : focal treatment -->
        <rect x="140" y="552" width="440" height="96" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1.2"/>
        <text class="ev-eyebrow ev-eyebrow-ac" x="360" y="578" text-anchor="middle">PHASE 4 · UNDERSTANDING</text>
        <text class="ev-name" x="360" y="604" text-anchor="middle">Graph understanding</text>
        <text class="ev-sub" x="360" y="624" text-anchor="middle">GraphRAG → Neo4j · 18.5K entities · 75K rels</text>

        <!-- legend strip -->
        <line x1="30" y1="676" x2="690" y2="676" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="30" y="690" width="12" height="12" rx="2" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/>
        <text class="ev-legend" x="50" y="700">THE WORKING TWIN</text>
        <line x1="190" y1="696" x2="214" y2="696" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#evolution-arrow)"/>
        <text class="ev-legend" x="224" y="700">BOTTLENECK SOLVED</text>
      </svg>
