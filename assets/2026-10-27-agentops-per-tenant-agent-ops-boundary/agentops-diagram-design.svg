<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agentops-dd-title agentops-dd-desc" id="agentops-diagram-design-root">
        <title id="agentops-dd-title">AgentOps — the per-tenant ops boundary</title>
        <desc id="agentops-dd-desc">An agent team inside a Control Plane governance boundary watches a self-hosted observability stack, acts through an optional OpenBot console, and writes learnings back to the Self-Improving Ontology, closing the Phase 4 to Phase 1 loop; CopilotKit Intelligence is a flagged external dependency.</desc>

        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #agentops-diagram-design-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #agentops-diagram-design-root { font-family: var(--font-sans); color: var(--color-ink); }
      #agentops-diagram-design-root .diagram-container { width: 100%; overflow-x: auto; }
      #agentops-diagram-design-root .diagram-container { overflow-x: visible; }</style>
          <marker id="agentops-diagram-design-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="agentops-diagram-design-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="agentops-diagram-design-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="960" height="760" fill="#f5f5f5"/>

        <!-- Control Plane governance boundary (drawn before arrows/nodes) -->
        <rect x="250" y="140" width="460" height="416" rx="8"
              fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="6,4"/>
        <rect x="258" y="148" width="320" height="14" fill="#f5f5f5"/>
        <text x="262" y="159" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CONTROL PLANE · GOVERNANCE BOUNDARY</text>

        <!-- ===== ARROWS (before boxes) ===== -->
        <!-- A. operator -> console -->
        <line x1="480" y1="96" x2="480" y2="178" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agentops-diagram-design-arrow)"/>
        <rect x="486" y="126" width="64" height="16" fill="#f5f5f5"/>
        <text x="492" y="137" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">OPERATE</text>

        <!-- B. console -> team -->
        <line x1="480" y1="252" x2="480" y2="298" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agentops-diagram-design-arrow)"/>
        <rect x="486" y="268" width="48" height="16" fill="#f5f5f5"/>
        <text x="492" y="279" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">AG-UI</text>

        <!-- C. obs stack -> team (signals, upward, dashed) -->
        <line x1="480" y1="454" x2="480" y2="374" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#agentops-diagram-design-arrow)"/>
        <rect x="486" y="404" width="64" height="16" fill="#f5f5f5"/>
        <text x="492" y="415" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">SIGNALS</text>

        <!-- D. team -> ontology (learnings write-back, left-margin elbow, dashed) -->
        <path d="M 290,336 H 208 Q 200,336 200,344 V 644 Q 200,652 208,652 H 288"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#agentops-diagram-design-arrow)"/>
        <rect x="152" y="488" width="96" height="16" fill="#f5f5f5"/>
        <text x="200" y="499" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em" text-anchor="middle">LEARNINGS</text>

        <!-- E. CopilotKit -> console (external dependency, dashed, link) -->
        <line x1="758" y1="216" x2="672" y2="216" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#agentops-diagram-design-arrow-link)"/>

        <!-- leader to the callout -->
        <line x1="670" y1="652" x2="688" y2="652" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="692" y="656" fill="#2d3142" font-size="14" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">closes Phase 4 → Phase 1</text>

        <!-- ===== NODES ===== -->
        <!-- 1. Tenant operator (input) -->
        <rect x="360" y="40" width="240" height="56" fill="#f5f5f5"/>
        <rect x="360" y="40" width="240" height="56" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/>
        <text x="480" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Tenant operator</text>
        <text x="480" y="80" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">human · per-tenant</text>

        <!-- 2. OpenBot console (optional) -->
        <rect x="290" y="180" width="380" height="72" fill="#f5f5f5"/>
        <rect x="290" y="180" width="380" height="72" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="480" y="210" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">OpenBot console</text>
        <text x="480" y="232" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">optional · watch live · take the wheel · CEL-gated</text>

        <!-- 3. AgentOps team (FOCAL) -->
        <rect x="290" y="300" width="380" height="72" fill="#f5f5f5"/>
        <rect x="290" y="300" width="380" height="72" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="302" y="310" width="78" height="14" rx="2" fill="#bf4520" fill-opacity="0.12"/>
        <text x="306" y="320" fill="#bf4520" font-size="7" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.1em">AG-UI BOTS</text>
        <text x="480" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">AgentOps team</text>
        <text x="480" y="358" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">monitor → diagnose → remediate · self-healing (HITL)</text>

        <!-- 4. Observability stack (store) -->
        <rect x="270" y="456" width="420" height="72" fill="#f5f5f5"/>
        <rect x="270" y="456" width="420" height="72" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="480" y="482" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Self-hosted observability stack</text>
        <text x="480" y="504" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">OTel + Phoenix · Prometheus + Grafana + Loki · SGLang + vLLM-MTP</text>

        <!-- 5. Self-Improving Ontology (store / knowledge) -->
        <rect x="290" y="620" width="380" height="64" fill="#f5f5f5"/>
        <rect x="290" y="620" width="380" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="480" y="644" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Self-Improving Ontology</text>
        <text x="480" y="666" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">incident · audit · learnings · MTTD&lt;5m · MTTR&lt;15m</text>

        <!-- 6. CopilotKit Intelligence (external, flagged) -->
        <rect x="760" y="180" width="180" height="72" fill="#f5f5f5"/>
        <rect x="760" y="180" width="180" height="72" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <text x="850" y="210" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">CopilotKit Intelligence</text>
        <text x="850" y="232" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">threads + memory · replace</text>

        <!-- ===== LEGEND (bottom strip) ===== -->
        <g font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.1em" fill="#5a6580">
          <rect x="250" y="726" width="14" height="14" rx="2" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.20" stroke-dasharray="3,2"/>
          <text x="270" y="737">OPTIONAL</text>

          <rect x="360" y="726" width="14" height="14" rx="2" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520"/>
          <text x="380" y="737">FOCAL</text>

          <rect x="450" y="726" width="14" height="14" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75"/>
          <text x="470" y="737">STORE</text>

          <rect x="540" y="726" width="14" height="14" rx="2" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30"/>
          <text x="560" y="737">EXTERNAL</text>

          <rect x="650" y="726" width="14" height="14" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-dasharray="4,3"/>
          <text x="670" y="737">BOUNDARY</text>

          <line x1="250" y1="752" x2="710" y2="752" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
          <text x="250" y="764" fill="#5a6580" font-size="7">solid = live flow · dashed = optional / return / external · accent = the agent team (focal)</text>
        </g>

      </svg>
