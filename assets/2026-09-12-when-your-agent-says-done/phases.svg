<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">When Your Agent Says "Done"</title>
  <desc id="d">Seven stages, executive summary: five that built the workflow, then two properties of the finished system.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="720" height="980" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="34" font-size="22" font-weight="600" fill="#1a1a18">From Trust to Evidence</text>
  <text x="40" y="58" font-size="13" fill="#88877f">How completion stopped being a feeling &#8212; and became a fact</text>

  <!-- ════════════════════════════════════════════════════════════
       STAGE 1: TRUST   y=84
       ════════════════════════════════════════════════════════════ -->
  <g>
    <circle cx="56" cy="108" r="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="56" y="108" font-size="16" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">1</text>
    <text x="92" y="100" font-size="16" font-weight="600" fill="#444441">Trust</text>
    <text x="92" y="122" font-size="13" fill="#5f5e5a">Everyone agreed it was done</text>
  </g>

  <!-- connector to stage 2 -->
  <line x1="56" y1="148" x2="56" y2="186" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════════════════════════
       STAGE 2: FALSE CHECKPOINT   y=188
       ════════════════════════════════════════════════════════════ -->
  <g>
    <circle cx="56" cy="212" r="18" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
    <text x="56" y="212" font-size="16" font-weight="600" fill="#791F1F" text-anchor="middle" dominant-baseline="central">2</text>
    <text x="92" y="204" font-size="16" font-weight="600" fill="#791F1F">The false checkpoint</text>
    <text x="92" y="226" font-size="13" fill="#A32D2D">The check passed on a lie</text>
  </g>

  <!-- connector to stage 3 -->
  <line x1="56" y1="252" x2="56" y2="290" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════════════════════════
       STAGE 3: EXECUTABLE CHECKS   y=292
       ════════════════════════════════════════════════════════════ -->
  <g>
    <circle cx="56" cy="316" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="56" y="316" font-size="16" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">3</text>
    <text x="92" y="308" font-size="16" font-weight="600" fill="#085041">Executable checks</text>
    <text x="92" y="330" font-size="13" fill="#0F6E56">Done became a fact, not a word</text>
  </g>

  <!-- connector to stage 4 -->
  <line x1="56" y1="356" x2="56" y2="394" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════════════════════════
       STAGE 4: THE SELF-RUNNING LOOP   y=396
       ════════════════════════════════════════════════════════════ -->
  <g>
    <circle cx="56" cy="420" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="56" y="420" font-size="16" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">4</text>
    <text x="92" y="412" font-size="16" font-weight="600" fill="#085041">The self-running loop</text>
    <text x="92" y="434" font-size="13" fill="#0F6E56">Work ends on evidence, not a report</text>
  </g>

  <!-- connector to stage 5 -->
  <line x1="56" y1="460" x2="56" y2="498" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════════════════════════
       STAGE 5: FRESH-SESSION ONBOARDING   y=500
       ════════════════════════════════════════════════════════════ -->
  <g>
    <circle cx="56" cy="524" r="18" fill="#E8EEF5" stroke="#1E5AA8" stroke-width="1"/>
    <text x="56" y="524" font-size="16" font-weight="600" fill="#16365C" text-anchor="middle" dominant-baseline="central">5</text>
    <text x="92" y="516" font-size="16" font-weight="600" fill="#16365C">Onboarding</text>
    <text x="92" y="538" font-size="13" fill="#1E5AA8">Fresh starts, brought up to speed from disk</text>
  </g>

  <!-- ════════════════════════════════════════════════════════════
       DIVIDER  y=592
       ════════════════════════════════════════════════════════════ -->
  <line x1="40" y1="592" x2="680" y2="592" stroke="#5f5e5a" stroke-width="0.75"/>
  <text x="360" y="584" font-size="11" font-weight="600" fill="#88877f" text-anchor="middle" letter-spacing="2">&#183;&#160;&#160;&#160;THE FINISHED SYSTEM&#160;&#160;&#160;&#183;</text>

  <!-- Stage 6 + 7: two property cards side by side, y=620..784 -->
  <g>
    <rect x="40" y="620" width="312" height="164" rx="18" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <circle cx="70" cy="654" r="18" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <text x="70" y="654" font-size="16" font-weight="600" fill="#27500A" text-anchor="middle" dominant-baseline="central">6</text>
    <text x="104" y="654" font-size="15" font-weight="600" fill="#27500A" dominant-baseline="central">&#8220;Done&#8221; = five tests</text>
    <text x="70" y="712" font-size="13" fill="#27500A">Every condition is mechanical</text>
    <text x="70" y="734" font-size="13" fill="#3B6D11">Queue empty &#183; script passes</text>
    <text x="70" y="754" font-size="13" fill="#3B6D11">&#183; code builds &#183; types check</text>
    <text x="70" y="774" font-size="13" fill="#3B6D11">&#183; every task&#39;s test passes</text>
  </g>

  <g>
    <rect x="368" y="620" width="312" height="164" rx="18" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <circle cx="398" cy="654" r="18" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="398" y="654" font-size="16" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">7</text>
    <text x="432" y="654" font-size="15" font-weight="600" fill="#712B13" dominant-baseline="central">The verifier verifies itself</text>
    <text x="398" y="712" font-size="13" fill="#712B13">&#8220;It builds&#8221; is too broad</text>
    <text x="398" y="734" font-size="13" fill="#993C1D">A clean build proves</text>
    <text x="398" y="754" font-size="13" fill="#993C1D">nothing about a task</text>
    <text x="398" y="774" font-size="13" fill="#993C1D">Enforced by the script, not memory</text>
  </g>

  <!-- Footer -->
  <text x="360" y="846" font-size="12" fill="#88877f" text-anchor="middle">Trust &#8594; false proof &#8594; real checks &#8594; self-running loop &#8594; onboarding &#8594; five tests &#8594; self-checking verifier</text>

</svg>
