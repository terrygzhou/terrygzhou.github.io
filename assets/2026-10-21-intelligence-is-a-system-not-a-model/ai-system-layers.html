<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The four layers of an AI system</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #12141a;
      --color-ink:     #f5f7fc;
      --color-muted:   #9aa3b8;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · 3D · ArchiMate-aligned · Diagram Design</p>
    <h1>The four layers of an AI system — and where EyWALink's products sit</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-system-layers-title ai-system-layers-desc">
        <title id="ai-system-layers-title">The four layers of an AI system, and where EyWALink's products sit</title>
        <desc id="ai-system-layers-desc">A 3D dark layer stack showing four raised system layers — Operations, Validation, Orchestration, Knowledge — resting on a recessed commodity model base, with an EyWALink product chip mapped to each layer; layering mirrors the ArchiMate view model.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa3b8"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(245,247,252,0.06)"/>
          </pattern>
        </defs>

        <!-- ===== dark canvas ===== -->
        <rect width="100%" height="100%" fill="#1a1d27"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

        <!-- ===== left direction column (system -> commodity) ===== -->
        <line x1="100" y1="72" x2="100" y2="340" stroke="rgba(245,247,252,0.28)" stroke-width="1"/>
        <line x1="92"  y1="72"  x2="108" y2="72"  stroke="rgba(245,247,252,0.28)" stroke-width="1"/>
        <line x1="92"  y1="340" x2="108" y2="340" stroke="rgba(245,247,252,0.28)" stroke-width="1"/>
        <polygon points="96,72 104,72 100,64" fill="#9aa3b8"/>
        <text x="44" y="80" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SYSTEM</text>
        <text x="44" y="392" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">COMMODITY</text>

        <!-- ===== group caption ===== -->
        <text x="120" y="58" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">THE SYSTEM · COMPOUNDS WITH TENURE</text>

        <!-- ===== L4 Operations (raised 3D plate) ===== -->
        <rect x="120" y="72"  width="780" height="64" rx="6" fill="#2a2f40"/>
        <line x1="122" y1="73"  x2="898" y2="73"  stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
        <line x1="122" y1="135" x2="898" y2="135" stroke="#0c0e14" stroke-width="3"/>
        <rect x="897" y="72" width="3" height="64" fill="#0c0e14"/>
        <rect x="132" y="82" width="24" height="14" rx="2" fill="transparent" stroke="rgba(154,163,184,0.50)" stroke-width="0.8"/>
        <text x="144" y="92" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">L4</text>
        <text x="170" y="100" fill="#f5f7fc" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">Operations</text>
        <text x="170" y="118" fill="#9aa3b8" font-size="9" font-family="'Geist Mono', monospace">monitor · refresh · cost · trace</text>
        <!-- chips: AgenticOps + Loop Factory -->
        <rect x="460" y="84" width="190" height="40" rx="6" fill="#333a4f" stroke="#4a5470" stroke-width="1"/>
        <text x="472" y="100" fill="#f5f7fc" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif">AgenticOps</text>
        <text x="472" y="114" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace">OTel · Grafana · cost</text>
        <rect x="664" y="84" width="190" height="40" rx="6" fill="#333a4f" stroke="#4a5470" stroke-width="1"/>
        <text x="676" y="100" fill="#f5f7fc" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif">Loop Factory</text>
        <text x="676" y="114" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace">defect fix · auto-patch</text>

        <!-- ===== L3 Validation (raised 3D plate) ===== -->
        <rect x="120" y="140" width="780" height="64" rx="6" fill="#2a2f40"/>
        <line x1="122" y1="141" x2="898" y2="141" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
        <line x1="122" y1="203" x2="898" y2="203" stroke="#0c0e14" stroke-width="3"/>
        <rect x="897" y="140" width="3" height="64" fill="#0c0e14"/>
        <rect x="132" y="150" width="24" height="14" rx="2" fill="transparent" stroke="rgba(154,163,184,0.50)" stroke-width="0.8"/>
        <text x="144" y="160" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">L3</text>
        <text x="170" y="168" fill="#f5f7fc" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">Validation</text>
        <text x="170" y="186" fill="#9aa3b8" font-size="9" font-family="'Geist Mono', monospace">evals · guardrails · tool-call security</text>
        <!-- chip: Super-Eval-Test -->
        <rect x="680" y="152" width="200" height="40" rx="6" fill="#333a4f" stroke="#4a5470" stroke-width="1"/>
        <text x="692" y="168" fill="#f5f7fc" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif">Super-Eval-Test</text>
        <text x="692" y="182" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace">human-gated eval loop</text>

        <!-- ===== L2 Orchestration (raised 3D plate) ===== -->
        <rect x="120" y="208" width="780" height="64" rx="6" fill="#2a2f40"/>
        <line x1="122" y1="209" x2="898" y2="209" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
        <line x1="122" y1="271" x2="898" y2="271" stroke="#0c0e14" stroke-width="3"/>
        <rect x="897" y="208" width="3" height="64" fill="#0c0e14"/>
        <rect x="132" y="218" width="24" height="14" rx="2" fill="transparent" stroke="rgba(154,163,184,0.50)" stroke-width="0.8"/>
        <text x="144" y="228" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">L2</text>
        <text x="170" y="236" fill="#f5f7fc" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">Orchestration</text>
        <text x="170" y="254" fill="#9aa3b8" font-size="9" font-family="'Geist Mono', monospace">workflow · MCP · skills · human gates</text>
        <!-- chips: Control Plane + Skills/packs -->
        <rect x="460" y="220" width="190" height="40" rx="6" fill="#333a4f" stroke="#4a5470" stroke-width="1"/>
        <text x="472" y="236" fill="#f5f7fc" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif">Control Plane</text>
        <text x="472" y="250" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace">MCP · skills · state</text>
        <rect x="664" y="220" width="190" height="40" rx="6" fill="#333a4f" stroke="#4a5470" stroke-width="1"/>
        <text x="676" y="236" fill="#f5f7fc" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif">Skills / packs</text>
        <text x="676" y="250" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace">client runbooks</text>

        <!-- ===== L1 Knowledge (FOCAL — raised 3D plate, coral) ===== -->
        <rect x="120" y="276" width="780" height="64" rx="6" fill="#38324a"/>
        <rect x="120" y="276" width="780" height="64" rx="6" fill="none" stroke="#f08a59" stroke-width="1.5"/>
        <line x1="122" y1="277" x2="898" y2="277" stroke="rgba(240,138,89,0.40)" stroke-width="2"/>
        <line x1="122" y1="339" x2="898" y2="339" stroke="#0c0e14" stroke-width="3"/>
        <rect x="897" y="276" width="3" height="64" fill="#0c0e14"/>
        <rect x="132" y="286" width="24" height="14" rx="2" fill="transparent" stroke="rgba(240,138,89,0.55)" stroke-width="0.8"/>
        <text x="144" y="296" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">L1</text>
        <text x="170" y="304" fill="#f5f7fc" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">Knowledge</text>
        <text x="170" y="322" fill="#c9a29a" font-size="9" font-family="'Geist Mono', monospace">RAG · memory · digital twin (compounds)</text>
        <!-- chip: Digital Twins -->
        <rect x="680" y="288" width="200" height="40" rx="6" fill="#333a4f" stroke="#4a5470" stroke-width="1"/>
        <text x="692" y="304" fill="#f5f7fc" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif">Digital Twins</text>
        <text x="692" y="318" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace">Qdrant · Neo4j · Mem0</text>

        <!-- ===== Model base (recessed / commodity) ===== -->
        <rect x="120" y="352" width="780" height="64" rx="6" fill="#1e2230"/>
        <rect x="120" y="352" width="780" height="64" rx="6" fill="none" stroke="#4a5470" stroke-width="1" stroke-dasharray="4,3"/>
        <line x1="122" y1="353" x2="898" y2="353" stroke="#0c0e14" stroke-width="2"/>
        <line x1="122" y1="415" x2="898" y2="415" stroke="rgba(245,247,252,0.06)" stroke-width="2"/>
        <rect x="132" y="362" width="24" height="14" rx="2" fill="transparent" stroke="rgba(154,163,184,0.50)" stroke-width="0.8"/>
        <text x="144" y="372" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">M</text>
        <text x="170" y="380" fill="#f5f7fc" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif">Model</text>
        <text x="170" y="398" fill="#9aa3b8" font-size="9" font-family="'Geist Mono', monospace">swappable weights — the component, not the product</text>

        <!-- ===== ArchiMate alignment caption ===== -->
        <text x="120" y="436" fill="#9aa3b8" font-size="8.5" font-family="'Geist', system-ui, sans-serif" font-style="italic">Layering mirrors the ArchiMate view model (Strategy · Application · Technology); the model is the commodity substrate beneath all of it.</text>

        <!-- ===== legend ===== -->
        <line x1="120" y1="452" x2="900" y2="452" stroke="rgba(245,247,252,0.12)" stroke-width="0.8"/>
        <text x="120" y="472" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="484" width="14" height="14" rx="3" fill="#2a2f40"/>
        <line x1="120" y1="485" x2="134" y2="485" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
        <line x1="120" y1="497" x2="134" y2="497" stroke="#0c0e14" stroke-width="2"/>
        <text x="140" y="495" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace">system layer</text>
        <rect x="300" y="484" width="14" height="14" rx="3" fill="#38324a"/>
        <rect x="300" y="484" width="14" height="14" rx="3" fill="none" stroke="#f08a59" stroke-width="1.2"/>
        <text x="320" y="495" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace">compounding asset</text>
        <rect x="480" y="484" width="14" height="14" rx="3" fill="#1e2230"/>
        <rect x="480" y="484" width="14" height="14" rx="3" fill="none" stroke="#4a5470" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="500" y="495" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace">commodity model</text>
        <rect x="650" y="484" width="14" height="14" rx="3" fill="#333a4f" stroke="#4a5470" stroke-width="1"/>
        <text x="670" y="495" fill="#9aa3b8" font-size="8" font-family="'Geist Mono', monospace">EyWALink product</text>

      </svg>
    </div>
  </div>
</body>
</html>
