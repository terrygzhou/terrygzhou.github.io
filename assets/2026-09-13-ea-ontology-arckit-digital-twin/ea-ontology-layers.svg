<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ea-ontology-layers-title ea-ontology-layers-desc" id="ea-ontology-layers-root">
        <title id="ea-ontology-layers-title">EA ontology layer stack</title>
        <desc id="ea-ontology-layers-desc">The EA ontology meta-model sits on top as the governing layer; ArcKit's togaf-adm and oaa producers and the Qdrant-Neo4j-Mem0 digital twin read from it, and both persist their structured output into the shared machine-readable model store exposed to agents over MCP.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ea-ontology-layers-root { --color-paper: #f5f5f5;
      --color-ink:   #2d3142;
      --color-muted: #4f5d75;
      --color-soft:  #5a6580;
      --color-accent:#bf4520;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace; }
      #ea-ontology-layers-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ea-ontology-layers-root .diagram-container { width: 100%; overflow-x: auto; }
      #ea-ontology-layers-root .diagram-container { overflow-x: visible; }
      #ea-ontology-layers-root text { font-family: 'Geist', system-ui, sans-serif; }
      #ea-ontology-layers-root .oe-tier { font-family: var(--font-mono); font-size: 9px; font-weight: 600; letter-spacing: 0.14em; fill: #5a6580; }
      #ea-ontology-layers-root .oe-tier-ac { fill: #bf4520; }
      #ea-ontology-layers-root .oe-name { font-size: 15px; font-weight: 600; fill: #2d3142; }
      #ea-ontology-layers-root .oe-sub { font-family: var(--font-mono); font-size: 9px; fill: #4f5d75; }
      #ea-ontology-layers-root .oe-edge { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.04em; fill: #5a6580; }
      #ea-ontology-layers-root .oe-legend { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.06em; fill: #5a6580; }</style>
          <marker id="ea-ontology-layers-oe-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== band backgrounds ===== -->
        <rect x="20" y="40"  width="840" height="88" rx="6" fill="#bf4520" fill-opacity="0.06" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="20" y="176" width="840" height="96" rx="6" fill="#4f5d75" fill-opacity="0.05" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <rect x="20" y="312" width="840" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1"/>

        <!-- tier tabs -->
        <text class="oe-tier oe-tier-ac" x="36" y="64">L1 · EA ONTOLOGY</text>
        <text class="oe-tier" x="36" y="198">L2 · GENERATION + REASONING</text>
        <text class="oe-tier" x="36" y="334">L3 · MODEL STORE</text>

        <!-- L1 content -->
        <text class="oe-name" x="440" y="92" text-anchor="middle">Enterprise Architecture Ontology</text>
        <text class="oe-sub"  x="440" y="110" text-anchor="middle">capabilities · processes · apps · platforms · data · agents · initiatives · risks</text>

        <!-- L2 inner boxes -->
        <rect x="40"  y="204" width="388" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="oe-name" x="234" y="228" text-anchor="middle">arckit-togaf-adm + oaa</text>
        <text class="oe-sub"  x="234" y="246" text-anchor="middle">intake + generation</text>

        <rect x="452" y="204" width="388" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="oe-name" x="646" y="228" text-anchor="middle">Digital twin</text>
        <text class="oe-sub"  x="646" y="246" text-anchor="middle">Qdrant + Neo4j + Mem0 · retrieval</text>

        <!-- L3 content -->
        <text class="oe-name" x="440" y="338" text-anchor="middle">Machine-readable model store</text>
        <text class="oe-sub"  x="440" y="356" text-anchor="middle">graph DB · MCP-exposed for agent querying</text>

        <!-- ===== arrows (governs / persists) ===== -->
        <line x1="234" y1="128" x2="234" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ea-ontology-layers-oe-arrow)"/>
        <line x1="646" y1="128" x2="646" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ea-ontology-layers-oe-arrow)"/>
        <line x1="234" y1="260" x2="234" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ea-ontology-layers-oe-arrow)"/>
        <line x1="646" y1="260" x2="646" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ea-ontology-layers-oe-arrow)"/>

        <!-- arrow labels (opaque masks, 6-10px gap from stroke) -->
        <rect x="182" y="154" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text class="oe-edge" x="204" y="163" text-anchor="middle">GOVERNS</text>
        <rect x="654" y="154" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text class="oe-edge" x="676" y="163" text-anchor="middle">GOVERNS</text>
        <rect x="178" y="280" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text class="oe-edge" x="202" y="289" text-anchor="middle">PERSISTS</text>
        <rect x="654" y="280" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text class="oe-edge" x="678" y="289" text-anchor="middle">PERSISTS</text>

        <!-- ===== legend ===== -->
        <line x1="20" y1="400" x2="860" y2="400" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="36" y="414" width="12" height="12" rx="2" fill="#bf4520" fill-opacity="0.06" stroke="#bf4520" stroke-width="1"/>
        <text class="oe-legend" x="56" y="424">ONTOLOGY (focal)</text>
        <rect x="200" y="414" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text class="oe-legend" x="220" y="424">PRODUCER</text>
        <rect x="320" y="414" width="12" height="12" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text class="oe-legend" x="340" y="424">MODEL STORE</text>
        <line x1="440" y1="420" x2="464" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ea-ontology-layers-oe-arrow)"/>
        <text class="oe-legend" x="474" y="424">GOVERNS / PERSISTS</text>
      </svg>
