<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex hooks, with ArcKit as the control plane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Codex hooks, with ArcKit as the control plane</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="arckit-codex-hooks-title arckit-codex-hooks-desc">
        <title id="arckit-codex-hooks-title">Codex hooks, with ArcKit as the control plane</title>
        <desc id="arckit-codex-hooks-desc">One ArcKit hook script wired to six Codex lifecycle events, grouped as guardrail, context injector, and session logger, closing a memory loop from Stop back to SessionStart.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5a88"/></marker>
        </defs>

        <!-- background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ ZONES (under everything) ============ -->
        <!-- Guardrail -->
        <rect x="30" y="320" width="284" height="164" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="38" y="344" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="46" y="353" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">GUARDRAIL</text>
        <!-- Context injector -->
        <rect x="338" y="320" width="284" height="164" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="346" y="344" width="86" height="12" rx="2" fill="#f5f5f5"/>
        <text x="354" y="353" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CONTEXT</text>
        <!-- Session logger -->
        <rect x="652" y="320" width="284" height="164" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="660" y="344" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="668" y="353" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LOGGER</text>

        <!-- ============ ARROWS (before nodes) ============ -->
        <!-- goal -> harness -->
        <line x1="480" y1="96" x2="480" y2="118" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- harness -> script -->
        <line x1="480" y1="192" x2="480" y2="222" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- rules -> harness (dashed, passive policy) -->
        <line x1="270" y1="156" x2="338" y2="156" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- script -> guardrail -->
        <path d="M 410,288 V 296 Q 410,304 402,304 H 180 Q 172,304 172,312 V 318" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- script -> context -->
        <line x1="480" y1="288" x2="480" y2="318" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- script -> logger -->
        <path d="M 550,288 V 296 Q 550,304 558,304 H 786 Q 794,304 794,312 V 318" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Stop -> memory (write) -->
        <line x1="794" y1="472" x2="794" y2="502" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- memory -> SessionStart (the loop, accent dashed, payoff) -->
        <path d="M 672,532 H 488 Q 480,532 480,524 V 474" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

        <!-- arrow labels (mask + text) -->
        <!-- realised by -->
        <rect x="488" y="102" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="490" y="111" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">REALISED BY</text>
        <!-- spawns -->
        <rect x="488" y="198" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="490" y="207" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">SPAWNS·JSON IN</text>
        <!-- static -->
        <rect x="285" y="142" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="305" y="151" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STATIC</text>
        <!-- guardrail -->
        <rect x="263" y="292" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="291" y="301" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GUARDRAIL</text>
        <!-- context -->
        <rect x="488" y="298" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="490" y="307" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">CONTEXT</text>
        <!-- logging -->
        <rect x="644" y="292" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="672" y="301" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LOGGING</text>
        <!-- writes session -->
        <rect x="802" y="482" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="804" y="491" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">WRITES SESSION</text>

        <!-- ============ NODES ============ -->
        <!-- GOAL (motivation) -->
        <rect x="340" y="40" width="280" height="56" rx="6" fill="#ffffff"/>
        <rect x="340" y="40" width="280" height="56" rx="6" fill="none" stroke="#2d3142" stroke-width="1"/>
        <rect x="348" y="46" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="363" y="55" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GOAL</text>
        <text x="480" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Control-plane goal</text>
        <text x="480" y="82" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">guarantee lives in the harness</text>

        <!-- HARNESS (Codex + config) -->
        <rect x="340" y="120" width="280" height="72" rx="6" fill="#ffffff"/>
        <rect x="340" y="120" width="280" height="72" rx="6" fill="none" stroke="#2d3142" stroke-width="1"/>
        <rect x="348" y="126" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="374" y="135" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HARNESS</text>
        <text x="480" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Codex harness</text>
        <text x="480" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">fires lifecycle events · JSON in · exit 2 / JSON out</text>
        <text x="480" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">[[hooks.*]] in config.toml</text>

        <!-- .codex/rules/ (static policy) -->
        <rect x="30" y="120" width="240" height="72" rx="6" fill="#ffffff"/>
        <rect x="30" y="120" width="240" height="72" rx="6" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="38" y="126" width="42" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="59" y="135" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">POLICY</text>
        <text x="150" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">.codex/rules/</text>
        <text x="150" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">static allow · forbid</text>
        <text x="150" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">fires before the model decides</text>

        <!-- THE ONE SCRIPT (focal, accent) -->
        <rect x="340" y="224" width="280" height="64" rx="6" fill="rgba(191,69,32,0.08)"/>
        <rect x="340" y="224" width="280" height="64" rx="6" fill="none" stroke="#bf4520" stroke-width="1.4"/>
        <rect x="348" y="230" width="44" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.45)" stroke-width="0.8"/>
        <text x="370" y="239" fill="rgba(191,69,32,0.9)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SCRIPT</text>
        <text x="480" y="256" fill="#111111" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">arckit-codex-hook.mjs</text>
        <text x="480" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one script · dispatches on argv</text>
        <text x="480" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">node "$HOOK" &lt;Event&gt;</text>

        <!-- GUARDRAIL zone nodes -->
        <rect x="50" y="352" width="244" height="56" rx="6" fill="#ffffff"/>
        <rect x="50" y="352" width="244" height="56" rx="6" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <rect x="58" y="358" width="42" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="79" y="367" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
        <text x="172" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PreToolUse</text>
        <text x="172" y="399" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">taxonomy · secrets · files</text>

        <rect x="50" y="416" width="244" height="56" rx="6" fill="#ffffff"/>
        <rect x="50" y="416" width="244" height="56" rx="6" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <rect x="58" y="422" width="42" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="79" y="431" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
        <text x="172" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PermissionRequest</text>
        <text x="172" y="463" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">whitelist MCP servers</text>

        <!-- CONTEXT zone nodes -->
        <rect x="358" y="352" width="244" height="56" rx="6" fill="#ffffff"/>
        <rect x="358" y="352" width="244" height="56" rx="6" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <rect x="366" y="358" width="42" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="387" y="367" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
        <text x="480" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">UserPromptSubmit</text>
        <text x="480" y="399" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">block secrets · inject graph</text>

        <rect x="358" y="416" width="244" height="56" rx="6" fill="#ffffff"/>
        <rect x="358" y="416" width="244" height="56" rx="6" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <rect x="366" y="422" width="42" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="387" y="431" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
        <text x="480" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SessionStart</text>
        <text x="480" y="463" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">prime workspace · load memory</text>

        <!-- LOGGER zone nodes -->
        <rect x="672" y="352" width="244" height="56" rx="6" fill="#ffffff"/>
        <rect x="672" y="352" width="244" height="56" rx="6" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <rect x="680" y="358" width="42" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="701" y="367" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
        <text x="794" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PostToolUse</text>
        <text x="794" y="399" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">stamp provenance · reindex</text>

        <rect x="672" y="416" width="244" height="56" rx="6" fill="#ffffff"/>
        <rect x="672" y="416" width="244" height="56" rx="6" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <rect x="680" y="422" width="42" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="701" y="431" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
        <text x="794" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Stop</text>
        <text x="794" y="463" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">classify · write memory</text>

        <!-- memory/sessions.md (store) -->
        <rect x="672" y="504" width="244" height="56" rx="6" fill="#ececec"/>
        <rect x="672" y="504" width="244" height="56" rx="6" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <rect x="680" y="510" width="38" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="699" y="519" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="794" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">memory/sessions.md</text>
        <text x="794" y="551" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">last 30 session log entries</text>

        <!-- ============ LEGEND (bottom strip) ============ -->
        <line x1="30" y1="600" x2="930" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="618" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="30" y1="634" x2="58" y2="634" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="66" y="637" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">SOLID · CONTROL FLOW</text>
        <line x1="230" y1="634" x2="258" y2="634" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="266" y="637" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">DASHED · POLICY / MEMORY LOOP</text>
        <line x1="520" y1="634" x2="548" y2="634" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4,3"/>
        <text x="556" y="637" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">CORAL · THE ONE SCRIPT + LOOP</text>
      </svg>
    </div>
  </div>
</body>
</html>
