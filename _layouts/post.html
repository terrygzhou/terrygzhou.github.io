---
layout: default
---
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | json_escape }},
  "description": {{ page.description | json_escape }},
  "datePublished": "{{ page.date | date: '%Y-%m-%d' }}",
  "dateModified": "{{ page.last_modified | default: page.date | date: '%Y-%m-%d' }}",
  "author": {
    "@type": "Person",
    "name": "Terry Zhou"
  },
  "publisher": {
    "@type": "Organization",
    "name": "EYwALink",
    "url": "https://eywalink.org"
  },
  "mainEntityOfPage": "{{ site.url }}{{ page.url }}",
  "image": {{ page.image | default: '/assets/og-default.png' | absolute_url | json_escape }}
}
</script>

<article class="post" itemscope itemtype="http://schema.org/BlogPosting">

  <header class="post-header">
    <h1 class="post-title" itemprop="name headline">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
        {{ page.date | date: "%b %-d, %Y" }}
      </time>
      <span class="post-meta__views">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span data-views-count data-path="{{ page.url | relative_url }}">…</span>
      </span>
    </p>
  </header>

  <div class="post-content" itemprop="articleBody">
    {{ content }}
  </div>

</article>

<div class="post-navigation">
  {% if page.previous %}
    <a class="prev" href="{{ page.previous.url }}">{{ page.previous.title }}</a>
  {% endif %}
  {% if page.next %}
    <a class="next" href="{{ page.next.url }}">{{ page.next.title }}</a>
  {% endif %}
</div>
