schema: spec-driven

context: |
  Tech stack: Jekyll (remote theme pages-themes/architect) on GitHub Pages; custom
  HTML/SCSS; posts in Markdown with frontmatter; assets as D2/PlantUML-generated
  diagrams. Build runs in UTC; post dates authored locally (Australia/Melbourne).
  Analytics: self-hosted Matomo 5.x core (free features only) is the SOLE web
  tracker (site 2 = terrygzhou.github.io, cookieless). Self-hosted Umami was
  retired 2026-11-16 (its script removed from the site, its bake cron deleted);
  Matomo runs on the Pop!_OS home server (matomo + matomo-mariadb containers,
  host port 3104, public via nginx gateway :3080 as matomo.eywalink.org).
  Conventions: keep the site cookieless (only first-party ew_reader_id cookie);
  prefer free/core tooling, no paid add-ons; all infra local, no cloud.
