title: Terry Zhou
email: terry.zhou@ymail.com
description: "Enterprise Architecture · Agentic AI · Digital + AI Transformation · Software Engineering" # build: 2026-07-06 23:15:29
baseurl: ""
url: "https://terrygzhou.github.io"
# Post dates are authored locally; parse in the author's zone so same-day
# posts aren't dropped by Jekyll's future-date filter (builds run in UTC).
timezone: Australia/Melbourne
github_username: terrygzhou

# Agent task notes (EYW-*.md) live at the repo root for Paperclip/vault sync.
# They must NOT be Jekyll source — GitHub Pages renders root-level .md through
# Liquid and any {% ... %} token in a note (e.g. EYW-669/EYW-670 documenting
# the head-custom.html template) breaks the whole site build.
exclude:
    - EYW-*.md

remote_theme: pages-themes/architect@v0.2.0
plugins:
    - jekyll-remote-theme
    - jekyll-feed
    - jekyll-seo-tag

defaults:
    - scope:
          path: ""
          type: posts
      values:
          layout: post
# last-built: 2026-07-06 23:13:12

